# =============================================================================
# DDNS Gateway 配置文件
# =============================================================================
#
# 本文件是 DDNS Gateway 的配置模板。使用前请复制此文件并重命名为 config.toml：
#   cp config.example.toml config.toml
#
# 配置优先级（从高到低）：
#   1. 命令行参数
#   2. 配置文件
#   3. 默认值
#
# 提示：所有配置项都有默认值，您只需配置需要修改的项目。
# =============================================================================

# -----------------------------------------------------------------------------
# 服务器配置
# -----------------------------------------------------------------------------
[server]

    # 监听地址
    # 默认值: "127.0.0.1"
    # 说明: 出于安全考虑，默认只监听本地回环地址。
    #       如需外部访问，请设置为 "0.0.0.0"（配合 Nginx 反向代理更安全）。
    host = "127.0.0.1"

    # 监听端口
    # 默认值: 38080
    port = 38080

# -----------------------------------------------------------------------------
# 认证配置
# -----------------------------------------------------------------------------
[auth]

    # 是否启用认证
    # 默认值: false
    # 说明: 强烈建议在生产环境中启用认证。启用后，所有请求必须携带有效的 Token。
    enabled = false

    # 认证 Token 列表
    # 默认值: []
    # 说明: 多个 Token 便于密钥轮换。请求时通过 Header 携带：
    #       Authorization: Bearer <token>
    #       如需传递上游凭据，请使用：
    #       X-Upstream-Authorization: <credentials>
    tokens = [  ]

# -----------------------------------------------------------------------------
# 日志配置
# -----------------------------------------------------------------------------
[logging]

    # 日志级别
    # 可选值: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
    # 默认值: "INFO"
    level = "INFO"

    # 是否启用文件日志
    # 默认值: false
    # 说明: 启用后，日志将同时写入到指定文件。
    file_enabled = false

    # 日志文件路径
    # 默认值: "./logs/ddns-gateway.log"
    # 说明: 支持相对路径和绝对路径。父目录会自动创建。
    file_path = "./logs/ddns-gateway.log"

# -----------------------------------------------------------------------------
# 健康检查端点配置
# -----------------------------------------------------------------------------
[health]

    # 是否启用 /health 端点
    # 默认值: false
    # 说明: 启用后可通过 GET /health 检查服务状态，常用于负载均衡器健康检查。
    enabled = false

# -----------------------------------------------------------------------------
# 请求去重配置
# -----------------------------------------------------------------------------
[dedupe]

    # 是否启用请求去重
    # 默认值: true
    # 说明: 启用后，相同请求在时间窗口内只会执行一次，其他请求返回缓存结果。
    #       这对于防止路由器等设备频繁发送相同请求非常有用。
    enabled = true

    # 去重时间窗口（秒）
    # 默认值: 300 (5分钟)
    # 说明: 在此时间窗口内，相同的请求将返回缓存的结果。
    window_seconds = 300

    # 最大缓存条目数
    # 默认值: 1000
    # 说明: 缓存条目超过此数量时，将自动清理最旧的条目。
    max_entries = 1000

    # Singleflight 等待超时（秒）
    # 默认值: 30.0
    # 说明: 当并发请求命中同一资源时，等待首个请求完成的最长时间。
    singleflight_wait_timeout_sec = 30.0

    # Singleflight 租约时间（秒）
    # 默认值: 60.0
    # 说明: 首个请求获得的独占执行权的有效期。超时后其他请求可接管。
    singleflight_lease_sec = 60.0

    # 去重缓存持久化配置（子表）
    [dedupe.persist]

        # 是否启用持久化
        # 默认值: false
        # 说明: 启用后，去重缓存将保存到 SQLite 数据库，服务重启后可恢复。
        enabled = false

        # SQLite 数据库文件路径
        # 默认值: "./data/dedupe.db"
        path = "./data/dedupe.db"

        # 刷新间隔（秒）
        # 默认值: 600 (10分钟)
        # 说明: 每隔此时间将内存中的缓存数据刷写到磁盘。
        flush_interval_seconds = 600

        # 启动时是否立即刷新
        # 默认值: true
        # 说明: 服务启动后，是否立即将从磁盘加载的数据刷写回去（用于清理过期条目）。
        flush_on_startup = true

# -----------------------------------------------------------------------------
# 重试配置
# -----------------------------------------------------------------------------
[retry]

    # 是否启用自动重试
    # 默认值: true
    # 说明: 启用后，遇到临时性错误时会自动重试 API 请求。
    #       注意：本配置项为预留功能，目前仅 request_timeout_sec 生效。
    enabled = true

    # 最大尝试次数
    # 默认值: 3
    # 说明: 包含首次请求。例如设为 3 表示：首次 + 最多 2 次重试。
    #       注意：本配置项为预留功能，目前尚未实现。
    max_attempts = 3

    # 单次请求超时时间（秒）
    # 默认值: 7.0
    # 说明: 每次 HTTP 请求的超时时间。这是已实现并生效的配置项。
    request_timeout_sec = 7.0

    # 基础延迟时间（毫秒）
    # 默认值: 1000
    # 说明: 重试时的初始等待时间，采用指数退避策略递增。
    #       注意：本配置项为预留功能，目前尚未实现。
    base_delay_ms = 1000

    # 最大延迟时间（毫秒）
    # 默认值: 10000
    # 说明: 重试等待时间的上限。
    #       注意：本配置项为预留功能，目前尚未实现。
    max_delay_ms = 10000

    # 是否添加随机抖动
    # 默认值: true
    # 说明: 在延迟时间上添加随机抖动，避免多个客户端同时重试造成拥塞。
    #       注意：本配置项为预留功能，目前尚未实现。
    jitter = true

    # 触发重试的 HTTP 状态码
    # 默认值: [429, 500, 502, 503, 504]
    # 说明: 收到这些状态码时会触发重试。
    #       注意：本配置项为预留功能，目前尚未实现。
    on_http_status = [ 429, 500, 502, 503, 504 ]

# -----------------------------------------------------------------------------
# 响应配置
# -----------------------------------------------------------------------------
[response]

    # 是否在响应中包含调试信息
    # 默认值: false
    # 说明: 启用后，响应的 meta.debug 字段将包含原始输入和规范化后的值。
    #       仅建议在开发/调试时启用。
    include_debug_info = false
